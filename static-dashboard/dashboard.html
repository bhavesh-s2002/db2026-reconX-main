<!doctype html>
<!--
============================================================================
TICKET-ADV098 — Nested Flexbox page shell
TICKET-ADV099 — CSS Design Tokens
TICKET-ADV100 — Dark/Light Theme Toggle + ARIA
============================================================================
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Prevent FOUC by applying saved theme before CSS loads -->
  <script>
    (function () {
      const saved = localStorage.getItem("reconx-theme") || "light";
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="app-shell">

<header class="app-header" role="banner">
  <h1 class="layout__title">ReconX</h1>

  <nav class="layout__nav" aria-label="Main navigation">
    <a href="dashboard.html" aria-current="page">Dashboard</a>
    <a href="trades.html">Trades</a>
    <a href="recon.html">Recon</a>
  </nav>

  <button
          id="theme-toggle"
          aria-label="Toggle light/dark theme"
          aria-pressed="false">
    Theme
  </button>
  <span id="sse-status" class="status-badge">
    Demo
</span>
</header>

<div class="app-body">

  <aside class="app-sidebar" role="complementary">
    <h2>Quick filters</h2>

    <ul>
      <li><a href="#">All trades</a></li>
      <li><a href="#">Open breaks</a></li>
      <li><a href="#">Today</a></li>
    </ul>
  </aside>

  <main class="app-main" role="main">

    <section class="alert--danger" role="alert">
      Unmatched trades &gt; 0
    </section>

    <section aria-labelledby="kpi">

      <h2 id="kpi">Today at a glance</h2>

      <section class="dashboard-grid">

        <article class="stat-card">
          <h3>Trades</h3>
          <p>120</p>
        </article>

        <article class="stat-card">
          <h3>Matched</h3>
          <p>105</p>
        </article>

        <article class="stat-card stat-card--warn">
          <h3>Open breaks</h3>
          <p>15</p>
        </article>

      </section>

    </section>

    <section aria-labelledby="feed">

      <h2 id="feed">Live trade feed</h2>

      <div
              id="trade-feed"
              role="status"
              aria-live="polite"
              aria-atomic="false">
      </div>

    </section>

  </main>

</div>

<footer class="app-footer" role="contentinfo">
  <small>ReconX TDI 2026 · static dashboard (Day 7)</small>
</footer>

<script src="js/theme.js"></script>
<script src="js/sse.js"></script>

</body>
</html>
