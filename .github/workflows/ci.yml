# ============================================================================
# Multi-stage GitHub Actions pipeline
# Liquibase validate step
# Coverage gate (>= 10%)
# Build and Push to GHCR
# ============================================================================
name: ci

on:
  push:
    branches: [main, develop, "feature/**", "day10"]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: bhavesh-s2002

jobs:

  backend-build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reconx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install recon-audit-starter
        working-directory: recon-audit-starter
        run: ../backend/mvnw -B install
      - name: Liquibase validate
        working-directory: backend
        run: ./mvnw -B liquibase:validate || true
      - name: Build + test
        working-directory: backend
        run: ./mvnw -B verify
      - name: Coverage gate
        working-directory: backend
        env:
          MIN_COVERAGE: '10'
        run: |
          COVERAGE=$(awk -F',' 'NR>1 { covered+=$5; missed+=$4 } END { print covered / (covered + missed) * 100 }' target/site/jacoco/jacoco.csv 2>/dev/null || echo "0")
          echo "Line coverage: $COVERAGE%"
          awk "BEGIN { exit ($COVERAGE >= 10) ? 0 : 1 }"
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present
      - name: Test
        working-directory: frontend
        run: npm test --if-present
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-and-push:
    needs: [backend-build-and-test, frontend-build-and-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/reconx-backend:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/reconx-backend:${{ github.sha }}
      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/reconx-frontend:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/reconx-frontend:${{ github.sha }}
